---
# Front matter comment to ensure Jekyll properly reads file.
---

<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

{% include head.html %}

<body class="min-h-screen flex flex-col">
	{% include navbar.html %}

    <main class="container items-center mx-auto md:max-w-4xl xs:max-w-2xl py-10 px-6 flex-grow">

        <h1 class="text-4xl font-semibold text-text-primary">
            {{ page.title }}
        </h1>

        <div class="text-base text-text-secondary flex">
            {{ page.date | date: "%B %d, %Y" }}
            •
            {{ page.author }}
        </div>

        <div class="py-12">
            <img class="inline rounded-3xl" src="{{site.baseurl}}/images/blog/covers/{{ page.cover }}.png" alt="{{ page.title }} cover image">
          </div>

        <article class="page markdown-body">
            {{ content }}
        </article>
    </main>

    {% include footer.html %}
</body>

</html>
