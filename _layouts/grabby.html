---
# Front matter comment to ensure Jekyll properly reads file.
---
<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

{% include head.html %}

<body class="min-h-screen flex flex-col">
	{% include navbar.html %}
	<main class="flex-grow pb-24">
		<div class="container mx-auto">

			<div class="grid justify-items-center px-2">

				<div class="my-16 text-center items-center pt-12">
					<h1 class="text-5xl md:text-8xl font-extrabold text-slate-700">
						Grabby
					</h1>
					<div class="text-xl md:text-2xl max-w-96 pt-4">
						Capture sharp photos from video on iPhone and iPad with a fast, smooth frame grabbing experience.
					</div>
				</div>

				<a target="_self" href="https://itunes.apple.com/app/id6737150716">
					<img class="max-w-72 h-auto hover:shadow-md rounded-2xl active:shadow-2xl" src="{{site.baseurl}}/images/app_icon_dark.png" alt="Download Grabby on the App Store">
				</a>

				<div class="pt-8 md:pt-24">
					<!-- Image for Mobile (grabby_phone_screenshot_mobile) -->
					<img class="block md:hidden w-full h-auto"
						src="{{site.baseurl}}/images/grabby_phone_screenshot_mobile.png" alt="Grabby iPhone screenshots showing video frame capture">

					<!-- Image for Larger Views (grabby_phone_screenshot) -->
					<img class="hidden md:block object-fill inline max-w-3xl"
						src="{{site.baseurl}}/images/grabby_phone_screenshot.png" alt="Grabby app screenshots for capturing photos from video">
				</div>

				<div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 pt-8 md:pt-48">
					<!-- Column 1: Card 1 and Card 4 -->
					<div class="flex flex-col gap-4">
						<img class="w-full h-auto" src="{{site.baseurl}}/images/grabby_bento/bento-01.png" alt="Grabby feature card showing frame selection">
						<img class="w-full h-auto" src="{{site.baseurl}}/images/grabby_bento/bento-04.png" alt="Grabby feature card showing saved video photos">
					</div>

					<!-- Column 2: Card 2 and Card 5 -->
					<div class="flex flex-col gap-4">
						<img class="w-full h-auto" src="{{site.baseurl}}/images/grabby_bento/bento-02.png" alt="Grabby feature card showing precise video scrubbing">
						<img class="w-full h-auto" src="{{site.baseurl}}/images/grabby_bento/bento-05.png" alt="Grabby feature card showing high-quality still export">
					</div>

					<!-- Column 3: Card 3 and Card 6 -->
					<div class="flex flex-col gap-4">
						<img class="w-full h-auto" src="{{site.baseurl}}/images/grabby_bento/bento-03.png" alt="Grabby feature card showing favorite moments from videos">
						<img class="w-full h-auto" src="{{site.baseurl}}/images/grabby_bento/bento-06.png" alt="Grabby feature card showing quick sharing">
					</div>
				</div>

				<h2 class="text-5xl font-extrabold text-slate-700 pt-4 md:pt-32">
					Grabby
				</h2>

				<a class="pt-12" target="_self" href="https://itunes.apple.com/app/id6737150716">
					<img class="max-w-72 h-auto hover:shadow-md rounded-2xl active:shadow-2xl" src="{{site.baseurl}}/images/app_icon_dark.png" alt="Download Grabby on the App Store">
				</a>

			</div>
		</div>
	</main>
	{% include footer.html %}
</body>

</html>
